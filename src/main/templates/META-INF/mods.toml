modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[mixins]]
    config = "oritechthings.mixins.json"

[[dependencies.${mod_id}]]
    modId = "forge"
    type = "required"
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Oritech 1.20.1 backport (curseforge.com/minecraft/mc-mods/oritech-backported)
[[dependencies.${mod_id}]]
    modId = "oritech"
    type = "required"
    versionRange = "${oritech_version_range}"
    ordering = "BEFORE"
    side = "BOTH"
