plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.16'
    // Must be applied after ForgeGradle: registers the "parchment" mappings channel
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 with Minecraft 1.20.1, mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()

    exclusiveContent {
        forRepository {
            maven {
                url = 'https://maven.minecraftforge.net/'
            }
        }
        // Forge userdev artifacts
        filter {
            includeGroup 'net.minecraftforge'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Specify the version of Minecraft/Forge to use.
    // NOTE: This is a range, and the newest version will be used.
    // Do NOT also add "implementation net.minecraftforge:forge:..." here: the plain version would
    // win the Gradle version conflict against the mapped userdev version and the net.minecraft
    // classes would silently drop off the compile classpath (implementation extendsFrom minecraft).
    minecraft "net.minecraftforge:forge:${project.forge_version}"

    // Oritech 1.20.1 backport (curseforge.com/minecraft/mc-mods/oritech-backported)
    implementation "curse.maven:oritech-backported-1817588:9706700"

    // Companion deps (1.21.1 file builds for now — replace each with its 1.20.1 build when swapping oritech).
    implementation "curse.maven:athena-841890:5629395"
    implementation "curse.maven:architectury-419699:5786327"
    implementation "curse.maven:owolib-532610:5945693"
    implementation "curse.maven:geckolib-388172:6024484"

    implementation "curse.maven:ftlibrary-404465:6466106"
    implementation "curse.maven:ftpessential-410811:6179042"

    implementation "curse.maven:rhino-416294:6000610"
    implementation "curse.maven:kubejs-238086:5810100"
    implementation "curse.maven:jade-324717:6011258"
    implementation "curse.maven:trashcans-394535:5891067"
    implementation "curse.maven:supermarticonfig-438332:5546996"
    implementation "curse.maven:supermarticore-454372:6076757"
    implementation "curse.maven:chunkloaders-402924:5550217"
    implementation "curse.maven:shetiphiancore-71738:6978276"
    implementation "curse.maven:enderchest-363535:6913788"

    implementation "curse.maven:jei-238222:5846880"
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present at runtime testing but not for compilation.
// To include it in the userdev (the runtime env for testing mods), put the include local in a run above.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

minecraft {
    // The mappings channel and version to use for mappings.
    // Note: for parchment the version is the mappings date; the MC version is derived from the Forge version.
    mappings channel: 'parchment', version: project.parchment_mappings_version

    // The different run configs available
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'INFO'

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'INFO'
            property 'forge.logging.markers', 'REGISTRIES'
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.console.level', 'INFO'
            property 'forge.logging.markers', 'REGISTRIES'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range   : loader_version_range,
            oritech_version        : oritech_version,
            oritech_version_range  : oritech_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    // Replace properties in the mod files
    expand replaceProperties
}
// Include the output of "generateModMetadata" as a resource in the main jar
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on each project load
afterEvaluate {
    tasks.named("processResources", ProcessResources) {
        from(generateModMetadata)
    }
    tasks.named("jar", Jar) {
        from(generateModMetadata)
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Ensure the correct encoding is used to compile the project.
    options.encoding = 'UTF-8'
    options.release = 17
}
