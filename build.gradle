plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:oritech-backported-1817588:9706700")

    implementation fg.deobf("curse.maven:architectury-419699:5137938")
    implementation fg.deobf("curse.maven:geckolib-388172:8285794")

    runtimeOnly fg.deobf("curse.maven:jei-238222:9205046")
    runtimeOnly fg.deobf("curse.maven:jade-324717:8479276")
    runtimeOnly fg.deobf("curse.maven:rhino-416294:6186971")
    runtimeOnly fg.deobf("curse.maven:kubejs-238086:8020595")
    runtimeOnly fg.deobf("curse.maven:supermarticonfig-438332:4715408")
    runtimeOnly fg.deobf("curse.maven:supermarticore-454372:9689182")
    runtimeOnly fg.deobf("curse.maven:trashcans-394535:9289018")
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

minecraft {
    mappings channel: 'parchment', version: project.parchment_mappings_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'INFO'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'INFO'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.console.level', 'INFO'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            oritech_version        : oritech_version,
            oritech_version_range  : oritech_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    expand replaceProperties
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Oritech's mixin config ships without a refmap and its @Inject targets are SRG names, which don't exist in the
// dev (parchment-mapped) environment, so runClient/runData crash. Mixin falls back to "mixin.refmap.json" for configs
// without a refmap: that file maps Oritech's targets to their dev names. In production the SRG names are already
// correct, so it is dev-only and kept out of the jar.
tasks.named('jar', Jar) {
    exclude 'mixin.refmap.json'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

